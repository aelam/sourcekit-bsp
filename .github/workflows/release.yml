name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # See ci.yml: pin to the newest stable Xcode instead of an exact version so
  # the release doesn't break when the runner image rotates Xcode versions.
  # Swift comes from Xcode on macOS — do not install it separately.
  XCODE_VERSION: latest-stable

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify Release Version
      run: |
        set -euo pipefail

        release_version="$(
          sed -n 's/^[[:space:]]*static let current = "\(.*\)"[[:space:]]*$/\1/p' \
            Sources/sourcekit-bsp/SourceKitBSPVersion.swift
        )"
        tag_version="${GITHUB_REF_NAME#v}"

        if [ -z "$release_version" ]; then
          echo "Could not read SourceKitBSPVersion.current."
          exit 1
        fi

        if [ "$tag_version" != "$release_version" ]; then
          echo "Release tag ${GITHUB_REF_NAME} does not match version ${release_version}."
          exit 1
        fi

        echo "Release version ${release_version} matches tag ${GITHUB_REF_NAME}."

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Verify Swift Version
      run: |
        swift --version
        which swift

    - name: Build for macOS (Universal)
      run: |
        swift build -c release --arch arm64 --arch x86_64

    - name: Create Release Archive
      run: |
        mkdir -p release
        cp .build/apple/Products/Release/sourcekit-bsp release/sourcekit-bsp
        cp .build/apple/Products/Release/XcodeProjectCLI release/XcodeProjectCLI
        chmod +x release/sourcekit-bsp
        chmod +x release/XcodeProjectCLI

        # Create tar.gz
        tar -czf sourcekit-bsp-macos-universal.tar.gz -C release sourcekit-bsp XcodeProjectCLI

        # Create zip
        cd release && zip ../sourcekit-bsp-macos-universal.zip sourcekit-bsp XcodeProjectCLI && cd ..

    - name: Generate Checksums
      run: |
        shasum -a 256 sourcekit-bsp-macos-universal.tar.gz > checksums.txt
        shasum -a 256 sourcekit-bsp-macos-universal.zip >> checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          sourcekit-bsp-macos-universal.tar.gz
          sourcekit-bsp-macos-universal.zip
          checksums.txt
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        body: |
          ## Changes in this Release

          ### Installation

          #### Manual Installation
          1. Download `sourcekit-bsp-macos-universal.tar.gz`
          2. Extract the binary: `tar -xzf sourcekit-bsp-macos-universal.tar.gz`
          3. Move the executables to PATH: `sudo mv sourcekit-bsp XcodeProjectCLI /usr/local/bin/`

          ### Usage
          ```bash
          sourcekit-bsp --help
          ```

          ### Checksums
          Verify your download with the checksums provided in `checksums.txt`.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
