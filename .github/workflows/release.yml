name: Release

on:
  push:
    branches:
      - main
    paths:
      - Sources/sourcekit-bsp/SourceKitBSPVersion.swift
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  # A version push must not replace a pending manual release with a skipped run.
  group: >-
    ${{ github.event_name == 'push' && github.ref_type == 'branch' && contains(github.event.head_commit.message, 'Release-Run: ') && format('sourcekit-bsp-release-skip-{0}', github.run_id) || 'sourcekit-bsp-release' }}
  cancel-in-progress: false

env:
  # Swift comes from the newest stable Xcode on the macOS runner.
  XCODE_VERSION: latest-stable

jobs:
  version:
    name: Prepare Release Version
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      release_version: ${{ steps.release.outputs.release_version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        ssh-key: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_SSH_KEY || '' }}

    - name: Prepare release
      id: release
      env:
        BUMP_TYPE: ${{ inputs.bump }}
        BEFORE_SHA: ${{ github.event.before }}
        HAS_RELEASE_KEY: ${{ secrets.RELEASE_SSH_KEY != '' }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$HAS_RELEASE_KEY" != true ]; then
          echo "Configure the RELEASE_SSH_KEY repository secret before releasing." >&2
          exit 1
        fi
        python3 Scripts/prepare_release.py

  build-release:
    name: Build Release Binaries
    needs: version
    if: needs.version.outputs.should_publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_COMMIT: ${{ needs.version.outputs.commit }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.version.outputs.commit }}

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Verify Swift Version
      run: |
        swift --version
        which swift

    - name: Build for macOS (Universal)
      run: |
        swift build -c release --arch arm64 --arch x86_64

    - name: Create Release Archive
      run: |
        set -euo pipefail
        build_dir="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
        mkdir -p release
        cp "$build_dir/sourcekit-bsp" "$build_dir/SWBBuildServiceBundle" release/
        for resource in "$build_dir"/*.bundle "$build_dir"/*.resources "$build_dir"/*.dylib; do
          if [ -e "$resource" ]; then
            cp -R "$resource" release/
          fi
        done

        # Create tar.gz
        tar -czf sourcekit-bsp-macos-universal.tar.gz -C release .

        # Create zip
        cd release && zip -r ../sourcekit-bsp-macos-universal.zip . && cd ..

    - name: Generate Checksums
      run: |
        shasum -a 256 sourcekit-bsp-macos-universal.tar.gz > checksums.txt
        shasum -a 256 sourcekit-bsp-macos-universal.zip >> checksums.txt

    - name: Create Release Tag
      run: |
        set -euo pipefail
        git fetch --tags origin
        if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "Tag $RELEASE_TAG already points to another commit." >&2
            exit 1
          fi
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        files: |
          sourcekit-bsp-macos-universal.tar.gz
          sourcekit-bsp-macos-universal.zip
          checksums.txt
        generate_release_notes: true
        prerelease: ${{ contains(needs.version.outputs.tag_name, 'alpha') || contains(needs.version.outputs.tag_name, 'beta') || contains(needs.version.outputs.tag_name, 'rc') }}
        body: |
          ## Changes in this Release

          ### Installation

          #### Manual Installation
          1. Download `sourcekit-bsp-macos-universal.tar.gz`
          2. Create installation directories: `mkdir -p ~/.local/lib/sourcekit-bsp ~/.local/bin`
          3. Extract all components: `tar -xzf sourcekit-bsp-macos-universal.tar.gz -C ~/.local/lib/sourcekit-bsp`
          4. Link the server: `ln -sf ~/.local/lib/sourcekit-bsp/sourcekit-bsp ~/.local/bin/sourcekit-bsp`
          5. Add `~/.local/bin` to PATH. Keep the build service and resource bundles beside the server.

          ### Usage
          ```bash
          sourcekit-bsp --help
          ```

          ### Checksums
          Verify your download with the checksums provided in `checksums.txt`.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
