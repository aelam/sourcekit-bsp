name: macOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Use the newest stable Xcode on the runner. Pinning an exact version (e.g.
  # 16.2) breaks once the runner image drops it, and older Xcodes ship a Swift
  # too old for this package's swift-tools-version. `latest-stable` tracks a
  # Swift that stays backward-compatible with the declared 6.1 floor.
  # On macOS the Swift toolchain comes from Xcode, so we do NOT install Swift
  # separately (that conflicts with the selected Xcode).
  XCODE_VERSION: latest-stable

jobs:
  macos-build-and-test:
    name: macOS Build and Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/.cache/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build and Test
      run: |
        echo "Running tests in macOS CI mode..."
        swift test --enable-code-coverage
      env:
        CI: true
        MACOS_CI: true

    - name: Install LLVM
      run: brew install llvm

    - name: Generate coverage report
      run: |
        # Use Homebrew LLVM tools for better version compatibility
        LLVM_COV="/opt/homebrew/opt/llvm/bin/llvm-cov"
        LLVM_PROFDATA="/opt/homebrew/opt/llvm/bin/llvm-profdata"

        TEST_BINARY=$(find .build -path "*/Contents/MacOS/*PackageTests" -type f -perm +111 | head -1)

        # Try merging profraw files with newer LLVM tools
        if find .build -name "*.profraw" | head -1 >/dev/null 2>&1; then
          echo "Merging profraw files with Homebrew LLVM..."
          if $LLVM_PROFDATA merge -sparse .build/*/debug/codecov/*.profraw -o coverage.profdata 2>/dev/null; then
            $LLVM_COV export "$TEST_BINARY" -instr-profile=coverage.profdata -format=lcov > coverage.info
            echo "✅ Generated coverage using Homebrew LLVM tools"
          else
            echo "⚠️ Failed to merge profraw files"
            echo "# No coverage data available" > coverage.info
          fi
        else
          echo "⚠️ No profraw files found"
          echo "# No coverage data available" > coverage.info
        fi

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.info
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

  lint:
    name: Code Quality
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Cache Mint packages
      uses: actions/cache@v4
      with:
        path: ~/.mint
        key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
        restore-keys: |
          ${{ runner.os }}-mint-

    - name: Install Mint
      run: |
        brew install mint

    - name: Install tools via Mintfile
      run: |
        mint bootstrap

    - name: Run SwiftLint
      run: |
        mint run swiftlint --strict --reporter github-actions-logging

    - name: Check Swift Format
      run: |
        mint run swiftformat . --lint-only

  security-scan:
    name: Security Scan
    # No Xcode / Swift needed — run on Linux, which is much faster and cheaper
    # than a macOS runner for a Python + grep based scan.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: |
        python3 -m pip install --user --upgrade semgrep
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run Semgrep Security Scan
      run: |
        semgrep --config=p/swift --config=p/security-audit --config=p/secrets . || echo "Semgrep scan completed with findings"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential secrets..."

        SECRETS_FOUND=false

        if grep -rEi "api[_-]?key\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential API key pattern found"
          SECRETS_FOUND=true
        fi

        if grep -rEi "token\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential token pattern found"
          SECRETS_FOUND=true
        fi

        if grep -rEi "password\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential password pattern found"
          SECRETS_FOUND=true
        fi

        if [ "$SECRETS_FOUND" = false ]; then
          echo "✅ No obvious secrets found"
        fi
