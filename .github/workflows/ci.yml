name: macOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Use the newest stable Xcode on the runner. Pinning an exact version (e.g.
  # 16.2) breaks once the runner image drops it, and older Xcodes ship a Swift
  # too old for this package's swift-tools-version. `latest-stable` tracks a
  # Swift that stays backward-compatible with the declared 6.1 floor.
  # On macOS the Swift toolchain comes from Xcode, so we do NOT install Swift
  # separately (that conflicts with the selected Xcode).
  XCODE_VERSION: latest-stable

jobs:
  macos-build-and-test:
    name: macOS Build and Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Print toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          .build
          ~/.cache/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build and Test
      run: |
        echo "Running tests in macOS CI mode..."
        swift test --enable-code-coverage
      env:
        CI: true
        MACOS_CI: true

    - name: Generate coverage report
      shell: bash
      run: |
        set -euo pipefail

        COVERAGE_JSON="$(swift test --show-codecov-path)"
        PROFILE_DATA="$(dirname "$COVERAGE_JSON")/default.profdata"
        BUILD_DIR="$(swift build --show-bin-path)"
        COVERAGE_OBJECTS=()
        for TEST_BINARY in "$BUILD_DIR"/*.xctest/Contents/MacOS/*; do
          if [[ -f "$TEST_BINARY" && -x "$TEST_BINARY" ]]; then
            COVERAGE_OBJECTS+=(-object "$TEST_BINARY")
          fi
        done

        if [[ ! -s "$COVERAGE_JSON" || ! -s "$PROFILE_DATA" || ${#COVERAGE_OBJECTS[@]} -eq 0 ]]; then
          echo "::error::Expected a SwiftPM coverage report, merged profile, and test executables."
          exit 1
        fi

        xcrun llvm-cov export "${COVERAGE_OBJECTS[@]}" \
          -instr-profile="$PROFILE_DATA" \
          -format=lcov \
          -ignore-filename-regex='(^|/)(\.build|Tests|Tests-MacOS)/' \
          > coverage.info

        awk -F: '
          /^SF:/ { files++ }
          /^LF:/ { lines += $2 }
          /^LH:/ { hits += $2 }
          END {
            if (files == 0 || lines == 0) {
              print "::error::Coverage report contains no source lines."
              exit 1
            }
            printf "Coverage: %d files, %d/%d lines (%.2f%%)\n", files, hits, lines, 100 * hits / lines
          }
        ' coverage.info

    - name: Test DAP relay and project loading with one cooperative thread
      run: swift test --skip-build --filter 'DeviceDAPRelayTests|LLDBDAPServerTests|XcodeProjectManagerTests|SwiftPM'
      env:
        LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.info
        disable_search: true
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true

  lint:
    name: Code Quality
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Cache Mint packages
      uses: actions/cache@v4
      with:
        path: ~/.mint
        key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
        restore-keys: |
          ${{ runner.os }}-mint-

    - name: Install Mint
      run: |
        brew install mint

    - name: Install tools via Mintfile
      run: |
        mint bootstrap

    - name: Run SwiftLint
      run: |
        mint run swiftlint --strict --reporter github-actions-logging

    - name: Check Swift Format
      run: |
        mint run swiftformat . --lint

  security-scan:
    name: Security Scan
    # No Xcode / Swift needed — run on Linux, which is much faster and cheaper
    # than a macOS runner for a Python + grep based scan.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: |
        python3 -m pip install --user --upgrade semgrep
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run Semgrep Security Scan
      run: |
        semgrep --config=p/swift --config=p/security-audit --config=p/secrets . || echo "Semgrep scan completed with findings"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential secrets..."

        SECRETS_FOUND=false

        if grep -rEi "api[_-]?key\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential API key pattern found"
          SECRETS_FOUND=true
        fi

        if grep -rEi "token\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential token pattern found"
          SECRETS_FOUND=true
        fi

        if grep -rEi "password\s*[:=]\s*['\"][^'\"]*['\"]" Sources/ Tests/ --include="*.swift" 2>/dev/null; then
          echo "::warning::Potential password pattern found"
          SECRETS_FOUND=true
        fi

        if [ "$SECRETS_FOUND" = false ]; then
          echo "✅ No obvious secrets found"
        fi
